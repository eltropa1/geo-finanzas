<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geo Finanzas</title>

<style>
body { background:#111; color:#eee; font-family:Arial; padding:20px; margin:0;}
.card { background:#1e1e1e; padding:15px; margin-bottom:15px; border-radius:8px;}
button { padding:8px; background:#333; color:white; border:none; border-radius:6px;}
input, select { width:100%; padding:8px; margin-bottom:10px; background:#222; color:white; border:1px solid #444;}

.row { display:flex; gap:10px;}
.row button { flex:1; }

.ingreso { color:#4caf50; }
.gasto { color:#ff5252; }

.hist { display:flex; justify-content:space-between; border-bottom:1px solid #333; padding:8px 0;}
.hist-left { width:60%; }
.hist-right { width:40%; text-align:right; }

.small { font-size:12px; color:#aaa; }
.flash { background:#2e7d32; padding:8px; margin-bottom:10px; border-radius:6px; text-align:center;}
.control-wrap { display:grid; grid-template-columns:1.2fr 0.8fr; gap:15px; align-items:start; }
.control-day { display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid #333; padding:8px 0; align-items:center; }
.control-day-main { min-width:0; }
.control-actions { display:flex; gap:6px; align-items:center; text-align:right; }
.control-actions button { padding:5px 7px; }
.calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:7px; text-align:center; }
.calendar-head { color:#aaa; font-size:12px; }
.calendar-dot { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:auto; color:#111; font-weight:bold; font-size:13px; }
.day-ok { background:#4caf50; }
.day-low { background:#ffca28; }
.day-zero { background:#ff5252; color:#fff; }
.day-irregular { background:#9e9e9e; }
.day-future { background:#333; color:#aaa; }
.day-empty { min-height:32px; }
.ia-list p { margin:7px 0; }
@media (max-width:700px){
.control-wrap { grid-template-columns:1fr; }
.hist-left { width:55%; }
.hist-right { width:45%; }
}
</style>
</head>

<body>
<div id="app"></div>

<script>

let data = {
config:null,
movimientos:[],
conceptos:["cafe","tabaco","comida","cole","alquiler","transporte","orange","luz","internet","seguro","vaquita"],
precios:{ cafe:1.5, tabaco:6.7 },
cerrados:{},
snapshot:{ gastos:[], ingresos:[] },
irregularidades:{}
};

let modo="facturacion";
let editIndex=null;
let editSnapshot=null;
let flashMsg="";
let mesVisualizado=hoy().slice(0,7);

function normalizarData(){
if(!data.config) data.config=null;
if(!Array.isArray(data.movimientos)) data.movimientos=[];
if(!Array.isArray(data.conceptos)) data.conceptos=["cafe","tabaco","comida","cole","alquiler","transporte","orange","luz","internet","seguro","vaquita"];
if(!data.precios) data.precios={ cafe:1.5, tabaco:6.7 };
if(!data.cerrados) data.cerrados={};
if(!data.snapshot) data.snapshot={ gastos:[], ingresos:[] };
if(!data.irregularidades) data.irregularidades={};
if(!Array.isArray(data.snapshot.gastos)) data.snapshot.gastos=[];
if(!Array.isArray(data.snapshot.ingresos)) data.snapshot.ingresos=[];
if(data.config && !("objetivoDiario" in data.config)) data.config.objetivoDiario=300;
data.movimientos.forEach(m=>{
if(!("comentario" in m)) m.comentario="";
});
}

function save(){
try{
localStorage.setItem("geoData", JSON.stringify(data));
}catch(e){
alert("Error guardando datos");
}
}
function load(){
let d=localStorage.getItem("geoData");
if(d) data=JSON.parse(d);
normalizarData();
}

function hoy(){
const d=new Date();
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function init(){ load(); if(!data.config) config(); else main(); }

/* CONFIG */

function config(){
app.innerHTML=`
<h2>Inicio</h2>
<input id="saldo" placeholder="Saldo">
<input id="vaq" placeholder="Vaquita">
<input id="fc" placeholder="Fondo combustible">
<input id="ff" placeholder="Fondo facturas">
<input id="factMes" placeholder="Facturación acumulada">
<input id="combMes" placeholder="Combustible acumulado">
<button onclick="saveConfig()">Guardar</button>`;
}

function saveConfig(){
data.config={
saldo:+saldo.value||0,
vaquita:+vaq.value||0,
fc:+fc.value||0,
ff:+ff.value||0,
factMes:+factMes.value||0,
combMes:+combMes.value||0,
objetivoDiario:300
};
save(); main();
}

/* FECHAS */

function getMonthKey(fecha){
const d = new Date(fecha);
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}

function parseFechaInput(fecha){
return new Date(fecha+"T00:00:00").getTime();
}

function formatFecha(fecha){
const d=new Date(fecha||Date.now());
if(isNaN(d.getTime())) return hoy();
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function getDaysUntilEndOfMonth(monthKey){
const parts=monthKey.split("-");
const year=+parts[0];
const month=+parts[1]-1;
const now=new Date();
const last=new Date(year, month+1,0).getDate();
if(getMonthKey(Date.now())===monthKey) return Math.max(0,last-now.getDate());
return last;
}

function getMovimientosOrdenados(){
return data.movimientos
.map((m,i)=>({m,i}))
.sort((a,b)=>(b.m.fecha||0)-(a.m.fecha||0));
}

function getMovimientosCronologicos(){
return [...data.movimientos].sort((a,b)=>(a.fecha||0)-(b.fecha||0));
}

function esc(v){
return String(v||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;");
}

function mesCerrado(key){
return !!(data.cerrados && data.cerrados[key]);
}

function nombreMes(key){
const parts=key.split("-");
const d=new Date(+parts[0], +parts[1]-1, 1);
return d.toLocaleDateString("es-ES",{month:"long",year:"numeric"});
}

/* CALCULO */

function calc(){

let s=data.config.saldo;
let v=data.config.vaquita;
let fc=data.config.fc;
let ff=data.config.ff;
let fact=0;
let efectivo=0;
let tarjeta=0;
let comb=0;
let anticipo=0;
let ingresoExtra=0;

let totalGastos=0;
let totalOperativo=0;
let gastosRealesMes=0;
let stats={};

const gastosFijos=["alquiler","facturas","seguro","luz","internet","orange","cole"];

getMovimientosCronologicos().forEach(m=>{

const mesMovimiento = getMonthKey(m.fecha || Date.now());
const esMesVisualizado = mesMovimiento === mesVisualizado;

if(m.tipo==="facturacion"){
s+=m.efectivo||0;
if(esMesVisualizado){
fact+=m.total;
efectivo+=m.efectivo;
tarjeta+=(m.total-m.efectivo);
}
}

if(m.tipo==="anticipo"){
s+=m.importe;
if(esMesVisualizado){
anticipo+=m.importe;
}
}

if(m.tipo==="ingreso_extra"){
s+=m.importe;
if(esMesVisualizado){
ingresoExtra+=m.importe;
}
}

if(m.tipo==="gasto"){
s-=m.importe;
if(esMesVisualizado){
totalGastos+=m.importe;

if(!stats[m.concepto]) stats[m.concepto]=0;
stats[m.concepto]+=m.importe;
if(m.concepto!=="vaquita"){
gastosRealesMes+=m.importe;
}
}

if(m.concepto==="vaquita") v+=m.importe;

if(esMesVisualizado){
if(!gastosFijos.includes(m.concepto)){
totalOperativo+=m.importe;
}
}
}

if(m.tipo==="comb"){
if(fc>=m.importe) fc-=m.importe;
else{
let r=m.importe-fc;
fc=0;
s-=r;
}
if(esMesVisualizado){
comb+=m.importe;
totalGastos+=m.importe;
gastosRealesMes+=m.importe;
stats["combustible"]=(stats["combustible"]||0)+m.importe;
totalOperativo+=m.importe;
}
}

if(m.tipo==="toComb"){ v-=m.importe; fc+=m.importe; }
if(m.tipo==="toFact"){ v-=m.importe; ff+=m.importe; }

});

/* TAXI */

let porcentaje=fact<5000?0.45:0.5;
let tuTotal=fact*porcentaje;
let cobroReal=tuTotal-efectivo-anticipo;
let ingresosRealesMes=efectivo+anticipo+cobroReal+ingresoExtra;
let balanceMensual=ingresosRealesMes-gastosRealesMes;

/* IA */

let movimientosMes=data.movimientos.filter(m=>getMonthKey(m.fecha || Date.now())===mesVisualizado);
let diasFinMes=getDaysUntilEndOfMonth(mesVisualizado);
let gastoMedioOperativo=totalOperativo/Math.max(1,movimientosMes.length);

let saldoPrevisto=s-(gastoMedioOperativo*diasFinMes);
let gastoMaximo=diasFinMes>0?s/diasFinMes:s;

let estado="Vas bien";
if(saldoPrevisto<0) estado="No llegas";
else if(saldoPrevisto<100) estado="Vas justo";

let topConcepto=null, topValor=0;
for(let k in stats){
if(stats[k]>topValor){ topValor=stats[k]; topConcepto=k; }
}

let ahorro=topValor*0.2;

let controlComb="OK";
if((stats["combustible"]||0)>300) controlComb="Combustible alto";

return {
s,v,fc,ff,fact,efectivo,tarjeta,tuTotal,cobroReal,porcentaje,
estado,gastoMaximo,saldoPrevisto,topConcepto,topValor,ahorro,controlComb,
stats,totalGastos,comb,balanceMensual,movimientosMes:movimientosMes.length
};
}

/* CONTROL DE INGRESOS */

function getDiasMesAnalisis(monthKey){
const parts=monthKey.split("-");
const year=+parts[0];
const month=+parts[1]-1;
const last=new Date(year, month+1, 0).getDate();
let hasta=last;
if(getMonthKey(Date.now())===monthKey){
hasta=new Date().getDate();
}
let dias=[];
for(let d=1; d<=hasta; d++){
dias.push(monthKey+"-"+String(d).padStart(2,"0"));
}
return dias;
}

function diaSemanaCorto(fechaKey){
const d=new Date(fechaKey+"T00:00:00");
return d.toLocaleDateString("es-ES",{weekday:"long"});
}

function agruparIngresosPorDia(){
let porDia={};
data.movimientos.forEach(m=>{
if(m.tipo!=="facturacion") return;
if(getMonthKey(m.fecha||Date.now())!==mesVisualizado) return;
let key=formatFecha(m.fecha);
if(!porDia[key]) porDia[key]={total:0, efectivo:0, tarjeta:0};
let total=+m.total||0;
let efectivo=+m.efectivo||0;
porDia[key].total+=total;
porDia[key].efectivo+=efectivo;
porDia[key].tarjeta+=total-efectivo;
});
return porDia;
}

function calcControlIngresos(){
let objetivo=+(data.config && data.config.objetivoDiario)||300;
let porDia=agruparIngresosPorDia();
let dias=getDiasMesAnalisis(mesVisualizado).map(key=>{
let ingreso=porDia[key]||{total:0, efectivo:0, tarjeta:0};
let irregular=!!data.irregularidades[key];
let estado=irregular?"irregular":ingreso.total>=objetivo?"ok":ingreso.total>0?"low":"zero";
return {key, ingreso, irregular, estado};
});
let normales=dias.filter(d=>!d.irregular);
let trabajados=normales.filter(d=>d.ingreso.total>0);
let cumplidos=normales.filter(d=>d.ingreso.total>=objetivo).length;
let bajos=normales.filter(d=>d.ingreso.total>0 && d.ingreso.total<objetivo).length;
let sinIngresos=normales.filter(d=>d.ingreso.total===0).length;
let totalNormal=normales.reduce((t,d)=>t+d.ingreso.total,0);
let media=normales.length?totalNormal/normales.length:0;
let mejor=trabajados.length?Math.max(...trabajados.map(d=>d.ingreso.total)):0;
let peorTrabajado=trabajados.length?Math.min(...trabajados.map(d=>d.ingreso.total)):0;
return {objetivo, dias, normales, trabajados, cumplidos, bajos, sinIngresos, media, mejor, peorTrabajado};
}

function getRachaBajos(dias, objetivo){
let racha=0;
for(let i=dias.length-1; i>=0; i--){
let d=dias[i];
if(d.irregular) continue;
if(d.ingreso.total>0 && d.ingreso.total<objetivo) racha++;
else break;
}
return racha;
}

function getViernesFlojos(dias, objetivo){
let viernes=dias.filter(d=>!d.irregular && new Date(d.key+"T00:00:00").getDay()===5 && d.ingreso.total>0).slice(-3);
return viernes.length===3 && viernes.every(d=>d.ingreso.total<objetivo);
}

function getMejoresPeoresSemana(dias){
let mapa={};
dias.forEach(d=>{
if(d.irregular || d.ingreso.total<=0) return;
let wd=new Date(d.key+"T00:00:00").getDay();
if(!mapa[wd]) mapa[wd]={total:0,count:0};
mapa[wd].total+=d.ingreso.total;
mapa[wd].count++;
});
let items=Object.keys(mapa).map(k=>({wd:+k, media:mapa[k].total/mapa[k].count}));
items.sort((a,b)=>b.media-a.media);
return {mejor:items[0], segundo:items[1], peor:items[items.length-1]};
}

function nombreDiaSemana(wd){
return ["domingos","lunes","martes","miércoles","jueves","viernes","sábados"][wd]||"-";
}

function renderIAControl(c){
let mensajes=[];
let racha=getRachaBajos(c.dias,c.objetivo);
if(racha>=2) mensajes.push(`⚠ Llevas ${racha} días trabajados sin alcanzar el objetivo.`);
if(getViernesFlojos(c.dias,c.objetivo)) mensajes.push("⚠ 3 viernes consecutivos por debajo del objetivo.");
let patrones=getMejoresPeoresSemana(c.dias);
if(patrones.mejor && patrones.segundo) mensajes.push(`💡 Tus mejores días este mes han sido ${nombreDiaSemana(patrones.mejor.wd)} y ${nombreDiaSemana(patrones.segundo.wd)}.`);
else if(patrones.mejor) mensajes.push(`💡 Tus mejores días este mes han sido ${nombreDiaSemana(patrones.mejor.wd)}.`);
if(patrones.peor && patrones.mejor && patrones.peor.wd!==patrones.mejor.wd) mensajes.push(`⚠ Tus ${nombreDiaSemana(patrones.peor.wd)} recientes están siendo flojos.`);
let semanas={};
c.normales.forEach(d=>{
let fecha=new Date(d.key+"T00:00:00");
let semana=Math.ceil(fecha.getDate()/7);
if(!semanas[semana]) semanas[semana]={total:0,count:0};
semanas[semana].total+=d.ingreso.total;
semanas[semana].count++;
});
let keys=Object.keys(semanas).sort((a,b)=>+a-+b);
if(keys.length){
let ultima=semanas[keys[keys.length-1]];
let media=ultima.total/Math.max(1,ultima.count);
mensajes.push(`📈 Media semanal actual: ${media.toFixed(2)}€.`);
}
if(!mensajes.length) mensajes.push("✅ Sin alertas operativas este mes.");
return `<div class="ia-list">${mensajes.map(m=>`<p>${m}</p>`).join("")}</div>`;
}

function renderCalendarioControl(c){
let parts=mesVisualizado.split("-");
let year=+parts[0];
let month=+parts[1]-1;
let last=new Date(year, month+1, 0).getDate();
let first=new Date(year, month, 1).getDay();
let offset=(first+6)%7;
let porKey={};
c.dias.forEach(d=>porKey[d.key]=d);
let html=`<div class="calendar-grid">
<div class="calendar-head">L</div><div class="calendar-head">M</div><div class="calendar-head">X</div><div class="calendar-head">J</div><div class="calendar-head">V</div><div class="calendar-head">S</div><div class="calendar-head">D</div>`;
for(let i=0;i<offset;i++) html+=`<div class="day-empty"></div>`;
for(let d=1; d<=last; d++){
let key=mesVisualizado+"-"+String(d).padStart(2,"0");
let item=porKey[key];
let estado=item?item.estado:"future";
let clase=estado==="ok"?"day-ok":estado==="low"?"day-low":estado==="zero"?"day-zero":estado==="irregular"?"day-irregular":"day-future";
html+=`<div class="calendar-dot ${clase}">${d}</div>`;
}
html+=`</div>`;
return html;
}

function renderControlIngresos(){
let c=calcControlIngresos();
let lista=c.dias.map(d=>{
let fecha=new Date(d.key+"T00:00:00");
let dia=diaSemanaCorto(d.key);
let label=dia.charAt(0).toUpperCase()+dia.slice(1)+" "+String(fecha.getDate()).padStart(2,"0")+"/"+String(fecha.getMonth()+1).padStart(2,"0");
let icon=d.estado==="ok"?"🟢":d.estado==="low"?"🟡":d.estado==="zero"?"🔴":"⚪";
let total=d.irregular?"IRREGULAR":d.ingreso.total.toFixed(2)+"€";
let detalle=d.irregular?`${d.ingreso.total.toFixed(2)}€ reales`:`Ef. ${d.ingreso.efectivo.toFixed(2)}€ · Tarj. ${d.ingreso.tarjeta.toFixed(2)}€`;
return `
<div class="control-day">
<div class="control-day-main">
<div>${icon} ${label} → ${total}</div>
<div class="small">${detalle}</div>
</div>
<div class="control-actions">
<button onclick="toggleIrregularidad('${d.key}')">${d.irregular?"Normal":"Irregular"}</button>
</div>
</div>`;
}).join("");
return `
<div class="card">
<h3>Control de ingresos</h3>
<div class="row">
<input id="objetivoDiario" value="${c.objetivo}" placeholder="Objetivo diario">
<button onclick="saveObjetivoDiario()">Guardar objetivo</button>
</div>
<p>✅ Objetivo cumplido: ${c.cumplidos}</p>
<p>⚠ Por debajo objetivo: ${c.bajos}</p>
<p>🔴 Sin ingresos: ${c.sinIngresos}</p>
<p>📈 Media diaria: ${c.media.toFixed(2)}€</p>
<p>🔥 Mejor día: ${c.mejor.toFixed(2)}€</p>
<p>📉 Peor día trabajado: ${c.peorTrabajado.toFixed(2)}€</p>
<div class="control-wrap">
<div>${lista || `<p class="small">Sin días para analizar</p>`}</div>
<div>${renderCalendarioControl(c)}<h4>IA operativa</h4>${renderIAControl(c)}</div>
</div>
</div>`;
}

/* UI */

function main(){

let r=calc();

/* HISTORIAL */

let grupos={};
getMovimientosOrdenados().forEach(obj=>{
let m=obj.m, i=obj.i;
let key=getMonthKey(m.fecha||Date.now());
if(!grupos[key]) grupos[key]=[];
grupos[key].push({m,i});
});

let lista="";

Object.keys(grupos).sort().reverse().forEach(key=>{

let abierto=key===mesVisualizado;
let cerrado=mesCerrado(key);

lista+=`
<div class="card">
<h3 onclick="toggleMes('${key}')">${key} ${cerrado?"🔒":""} ${abierto?"▼":"▶"}</h3>
<div id="mes-${key}" style="display:${abierto?"block":"none"};">
`;

grupos[key].forEach(obj=>{
let m=obj.m, i=obj.i;

let clase=(m.tipo==="facturacion"||m.tipo==="anticipo"||m.tipo==="ingreso_extra")?"ingreso":"gasto";

if(editIndex===i){

lista+=`
<div class="hist">
<div>
<input id="editFecha" type="date" value="${formatFecha(m.fecha)}">
<input id="editImporte" value="${m.importe||m.total}">
<input id="editConcepto" value="${esc(m.concepto||"")}">
<input id="editComentario" value="${esc(m.comentario||"")}" placeholder="Comentario">
${m.tipo==="facturacion"?`<input id="editEfectivo" value="${m.efectivo}">`:""}
</div>
<div>
<button onclick="saveEdit(${i})">✔</button>
<button onclick="cancelEdit()">✖</button>
</div>
</div>`;

}else{

lista+=`
<div class="hist">
<div class="hist-left">
<div class="${clase}"><b>${m.tipo}</b></div>
<div class="small">${esc(m.concepto||"")}</div>
<div class="small">${esc(m.comentario||"")}</div>
<div class="small">${new Date(m.fecha||Date.now()).toLocaleDateString()}</div>
</div>
<div class="hist-right">
<div>${m.total||m.importe}€</div>
${cerrado?`<div class="small">Mes cerrado</div>`:`
<button onclick="edit(${i})">✏</button>
<button onclick="del(${i})">🗑</button>
`}
</div>
</div>`;
}

});

lista+=`</div></div>`;
});

/* STATS */

let statsHTML="";
for(let k in r.stats){
statsHTML+=`<p>${k}: ${r.stats[k].toFixed(2)}€</p>`;
}

let cerradoActual=mesCerrado(mesVisualizado);
let cierreTexto=cerradoActual?"Abrir mes":"Cerrar mes";
let balanceClase=r.balanceMensual>=0?"ingreso":"gasto";
let snapshotHTML=renderSnapshot();

app.innerHTML=`

<h2>Geo Finanzas</h2>
<div class="small">Mes visualizado: ${mesVisualizado} ${cerradoActual?"🔒":""}</div>

<div class="card">
<h3>${r.s.toFixed(2)}€</h3>
<p>Vaquita: ${r.v.toFixed(2)}</p>
<p>Combustible: ${r.fc.toFixed(2)}</p>
<p>Facturas: ${r.ff.toFixed(2)}</p>
</div>

<div class="card">
<p>Facturación: ${r.fact.toFixed(2)}</p>
<p>%: ${r.porcentaje*100}</p>
<p><b>Cobro real: ${r.cobroReal.toFixed(2)}€</b></p>
</div>

<div class="card">
<h3>Resumen mensual</h3>
<p>${nombreMes(mesVisualizado)}</p>
<p>Facturación: ${r.fact.toFixed(2)}€</p>
<p>Cobro real: ${r.cobroReal.toFixed(2)}€</p>
<p>Gastos: ${r.totalGastos.toFixed(2)}€</p>
<p>Combustible: ${r.comb.toFixed(2)}€</p>
<p>Balance: <span class="${balanceClase}">${r.balanceMensual>=0?"+":""}${r.balanceMensual.toFixed(2)}€</span></p>

<p>Movimientos: ${r.movimientosMes}</p>
<button onclick="toggleCierreMes()">${cierreTexto}</button>
</div>

<div class="card">
<h3>IA</h3>
<p>Estado: ${r.estado}</p>
<p>Gasto máximo hoy: ${r.gastoMaximo.toFixed(2)}€</p>
<p>Proyección fin de mes: ${r.saldoPrevisto.toFixed(2)}€</p>
<p>Fuga: ${r.topConcepto} (${(r.topValor||0).toFixed(2)}€)</p>
<p>Ahorro posible: ${r.ahorro.toFixed(2)}€</p>
<p>Combustible: ${r.controlComb}</p>
</div>

${renderControlIngresos()}

<div class="card">
<div class="row">
<button onclick="setModo('facturacion')">Ingreso</button>
<button onclick="setModo('gasto')">Gasto</button>
<button onclick="setModo('anticipo')">Anticipo</button>
<button onclick="setModo('ingreso_extra')">Ingreso Extra</button>
</div>

<div id="form"></div>
<button onclick="guardar()">Guardar</button>
</div>

<div class="card">
<h3>Stats</h3>
${statsHTML}
</div>

<div class="card">
<h3>Historial</h3>
${lista}
</div>

${snapshotHTML}

<div class="card">
<h3>Backup</h3>

<button onclick="exportarBackup()">Exportar Backup</button>
<button onclick="document.getElementById('backupFile').click()">Importar Backup</button>
</div>

renderForm();
}

/* FORM */

function setModo(m){ modo=m; renderForm(); }

function renderForm(){

let html="";

if(modo==="facturacion"){
html=`
<input id="fecha" type="date">
<input id="total" placeholder="Total día">
<input id="efectivo" placeholder="Efectivo">
<input id="comentario" placeholder="Comentario">
`;
}

if(modo==="anticipo"){
html=`
<input id="fecha" type="date">
<input id="importe" placeholder="Importe">
<input id="comentario" placeholder="Comentario">
`;
}

if(modo==="ingreso_extra"){
html=`
<input id="fecha" type="date">
<input id="importe" placeholder="Importe">
<input id="comentario" placeholder="Comentario">
`;
}

if(modo==="gasto"){
html=`
<input id="fecha" type="date">
<select id="concepto" onchange="autofill()">
${data.conceptos.map(c=>`<option>${c}</option>`).join("")}
<option value="toComb">→ Fondo Comb</option>
<option value="toFact">→ Fondo Fact</option>
<option value="combustible_directo">combustible</option>
</select>
<input id="nuevoConcepto" placeholder="Nuevo concepto">
<input id="importe" placeholder="Importe">
<input id="comentario" placeholder="Comentario">
`;
}

document.getElementById("form").innerHTML=html;

if(document.getElementById("fecha")){
document.getElementById("fecha").value=hoy();
}
}

/* AUTOFILL */

function autofill(){
let c=val("concepto");
if(data.precios[c]){
document.getElementById("importe").value=data.precios[c];
}
}

/* GUARDAR */

function guardar(){

let fecha=parseFechaInput(val("fecha")||hoy());
if(mesCerrado(getMonthKey(fecha))){
alert("Este mes está cerrado");
return;
}
let comentario=val("comentario");

if(modo==="facturacion"){
data.movimientos.push({
tipo:"facturacion",
total:+val("total"),
efectivo:+val("efectivo"),
fecha,
comentario
});
}

if(modo==="anticipo"){
data.movimientos.push({
tipo:"anticipo",
importe:+val("importe"),
fecha,
comentario
});
}

if(modo==="ingreso_extra"){
data.movimientos.push({
tipo:"ingreso_extra",
importe:+val("importe"),
fecha,
comentario
});
}

if(modo==="gasto"){

let concepto=val("nuevoConcepto")||val("concepto");
let importe=+val("importe");

if(concepto==="toComb"){
data.movimientos.push({tipo:"toComb",importe,fecha,comentario});
}
else if(concepto==="toFact"){
data.movimientos.push({tipo:"toFact",importe,fecha,comentario});
}
else if(concepto==="combustible_directo"){
data.movimientos.push({tipo:"comb",importe,fecha,comentario});
}
else{
if(!data.conceptos.includes(concepto)){
data.conceptos.push(concepto);
}
data.precios[concepto]=importe;

data.movimientos.push({
tipo:"gasto",
importe,
concepto,
fecha,
comentario
});
}
}

mesVisualizado=getMonthKey(fecha);
save();
main();
}

/* EDITAR */

function edit(i){
let m=data.movimientos[i];
if(mesCerrado(getMonthKey(m.fecha||Date.now()))){
alert("Este mes está cerrado");
return;
}
editIndex=i; main();
}

function saveEdit(i){
let m=data.movimientos[i];
if(mesCerrado(getMonthKey(m.fecha||Date.now()))){
alert("Este mes está cerrado");
editIndex=null;
main();
return;
}

m.fecha=parseFechaInput(document.getElementById("editFecha").value||hoy());
if(mesCerrado(getMonthKey(m.fecha))){
alert("Este mes está cerrado");
return;
}
m.concepto=document.getElementById("editConcepto").value;
m.comentario=document.getElementById("editComentario").value;

if(m.tipo==="facturacion"){
m.total=+document.getElementById("editImporte").value;
m.efectivo=+document.getElementById("editEfectivo").value;
}else{
m.importe=+document.getElementById("editImporte").value;
}

editIndex=null;
mesVisualizado=getMonthKey(m.fecha);
save();
main();
}

function cancelEdit(){ editIndex=null; main(); }

/* SNAPSHOT FINANCIERO */

function renderSnapshot(){
let gastos=data.snapshot.gastos;
let ingresos=data.snapshot.ingresos;
let totalGastos=gastos.reduce((t,x)=>t+(+x.importe||0),0);
let totalIngresos=ingresos.reduce((t,x)=>t+(+x.importe||0),0);
let balance=totalIngresos-totalGastos;

return `
<div class="card">
<h3>Snapshot financiero</h3>

<h4>Gastos estructurales</h4>
<input id="snapGastoNombre" placeholder="Nombre">
<input id="snapGastoImporte" placeholder="Importe">
<select id="snapGastoTipo">
<option value="fijo">fijo</option>
<option value="variable">variable</option>
</select>
<button onclick="addSnapshot('gastos')">Añadir gasto</button>
${renderSnapshotLista("gastos", gastos)}

<h4>Ingresos estructurales</h4>
<input id="snapIngresoNombre" placeholder="Nombre">
<input id="snapIngresoImporte" placeholder="Importe">
<select id="snapIngresoTipo">
<option value="fijo">fijo</option>
<option value="variable">variable</option>
</select>
<button onclick="addSnapshot('ingresos')">Añadir ingreso</button>
${renderSnapshotLista("ingresos", ingresos)}

<h4>Resumen estructural</h4>
<p>Ingresos estructurales: ${totalIngresos.toFixed(2)}€</p>
<p>Gastos estructurales: ${totalGastos.toFixed(2)}€</p>
<p>Balance estructural: <span class="${balance>=0?"ingreso":"gasto"}">${balance>=0?"+":""}${balance.toFixed(2)}€</span></p>
</div>
`;
}

function renderSnapshotLista(grupo, items){
let html="";
items.forEach((item,i)=>{
if(editSnapshot && editSnapshot.grupo===grupo && editSnapshot.index===i){
html+=`
<div class="hist">
<div class="hist-left">
<input id="snapEditNombre" value="${esc(item.nombre||"")}">
<input id="snapEditImporte" value="${+item.importe||0}">
<select id="snapEditTipo">
<option value="fijo" ${item.tipo==="fijo"?"selected":""}>fijo</option>
<option value="variable" ${item.tipo==="variable"?"selected":""}>variable</option>
</select>
</div>
<div class="hist-right">
<button onclick="saveSnapshotEdit('${grupo}',${i})">✔</button>
<button onclick="cancelSnapshotEdit()">✖</button>
</div>
</div>`;
}else{
html+=`
<div class="hist">
<div class="hist-left">
<div><b>${esc(item.nombre||"")}</b></div>
<div class="small">${esc(item.tipo||"fijo")}</div>
</div>
<div class="hist-right">
<div>${(+item.importe||0).toFixed(2)}€</div>
<button onclick="editSnapshotItem('${grupo}',${i})">✏</button>
<button onclick="deleteSnapshotItem('${grupo}',${i})">🗑</button>
</div>
</div>`;
}
});
if(!html) html=`<p class="small">Sin registros</p>`;
return html;
}

function addSnapshot(grupo){
let prefijo=grupo==="gastos"?"snapGasto":"snapIngreso";
let nombre=val(prefijo+"Nombre");
let importe=+val(prefijo+"Importe")||0;
let tipo=val(prefijo+"Tipo")||"fijo";
if(!nombre && !importe) return;
data.snapshot[grupo].push({
id:Date.now()+"-"+Math.random().toString(16).slice(2),
nombre,
importe,
tipo
});
save();
main();
}

function editSnapshotItem(grupo,i){
editSnapshot={grupo,index:i};
main();
}

function saveSnapshotEdit(grupo,i){
let item=data.snapshot[grupo][i];
if(!item) return;
item.nombre=val("snapEditNombre");
item.importe=+val("snapEditImporte")||0;
item.tipo=val("snapEditTipo")||"fijo";
editSnapshot=null;
save();
main();
}

function cancelSnapshotEdit(){
editSnapshot=null;
main();
}

function deleteSnapshotItem(grupo,i){
data.snapshot[grupo].splice(i,1);
save();
main();
}

/* ACCORDION */

function toggleMes(key){
mesVisualizado=key;
main();
}

function toggleCierreMes(){
data.cerrados[mesVisualizado]=!mesCerrado(mesVisualizado);
editIndex=null;
save();
main();
}

function exportarBackup(){
normalizarData();
const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="geo-finanzas-backup-"+hoy()+".json";
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
}

function importarBackup(event){
const file=event.target.files[0];
if(!file) return;
const reader=new FileReader();
reader.onload=function(){
try{
const nuevo=JSON.parse(reader.result);
if(!nuevo || !("config" in nuevo) || !Array.isArray(nuevo.movimientos)){
alert("JSON inválido");
return;
}
data=nuevo;
normalizarData();
save();
mesVisualizado=hoy().slice(0,7);
editIndex=null;
main();
}catch(e){
alert("JSON inválido");
}finally{
event.target.value="";
}
};
reader.onerror=function(){
alert("JSON inválido");
event.target.value="";
};
reader.readAsText(file);
}

/* HELPERS */

function saveObjetivoDiario(){
let objetivo=+val("objetivoDiario")||300;
if(!data.config) data.config={};
data.config.objetivoDiario=objetivo;
save();
main();
}

function toggleIrregularidad(key){
if(mesCerrado(key.slice(0,7))){
alert("Este mes está cerrado");
return;
}
if(!data.irregularidades) data.irregularidades={};
data.irregularidades[key]=!data.irregularidades[key];
if(!data.irregularidades[key]) delete data.irregularidades[key];
save();
main();
}

function val(id){ return document.getElementById(id)?.value||""; }
function del(i){
let m=data.movimientos[i];
if(mesCerrado(getMonthKey(m.fecha||Date.now()))){
alert("Este mes está cerrado");
return;
}
data.movimientos.splice(i,1); save(); main();
}

init();

</script>
</body>
</html>
